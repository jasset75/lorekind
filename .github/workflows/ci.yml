name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python3 .agents/skills/pull-request-contributions/scripts/test_check_pr_size.py
      - run: pnpm test:api

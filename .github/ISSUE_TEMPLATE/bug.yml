name: Bug report
description: Report reproducible incorrect behavior that is not a vulnerability
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here; use private vulnerability reporting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
